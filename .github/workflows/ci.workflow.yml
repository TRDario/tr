name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: GCC
            c_compiler: gcc
            cxx_compiler: g++
          - os: ubuntu-24.04
            compiler: Clang
            c_compiler: clang
            cxx_compiler: clang++
          - os: windows-2025-vs2026
            compiler: MSVC
            toolset: v145
          - os: windows-2025-vs2026
            compiler: Clang
            toolset: ClangCL

    env:
      ALSOFT_DRIVERS: "null"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install build tools and libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 libstdc++-14-dev ninja-build pkg-config gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libdecor-0-dev
      
      - name: Install LLVM (Linux)
        shell: bash
        if: runner.os == 'Linux' && matrix.compiler == 'Clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 23
      
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G "Ninja Multi-Config"
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DTR_BUILD_TESTS=ON
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -T ${{ matrix.toolset }}
          -DTR_BUILD_TESTS=ON
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      
      - name: Build and test all configurations
        shell: bash
        run: |
          set -euo pipefail
          for config in Debug RelWithDebInfo Release; do
            echo "Building $config"
            cmake --build build --config "$config" --parallel 2
            echo "Testing $config"
            ctest --test-dir build --build-config "$config" --output-on-failure --parallel 2
          done